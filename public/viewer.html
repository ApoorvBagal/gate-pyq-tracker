<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PDF · GATE PYQ</title>
<style>
  :root { --bg:#0f1220; --card:#181c2e; --line:#2a2f48; --fg:#e6e8f2; --mut:#8b90a8; --acc:#6c8cff;
          --ok:#3ecf8e; --bad:#ff6b6b; --shaky:#f5b041; --un:#5b6078; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#3a3d4a; color:var(--fg); font:14px/1.4 system-ui,Segoe UI,sans-serif; }
  #bar { position:fixed; top:0; left:0; right:0; z-index:10; display:flex; flex-wrap:wrap; gap:6px; align-items:center;
         padding:6px 10px; background:var(--bg); border-bottom:1px solid var(--line); }
  #bar .grp { display:flex; gap:3px; align-items:center; padding-right:8px; border-right:1px solid var(--line); }
  button, input { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 9px; }
  button { cursor:pointer; } button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  input#pg { width:62px; text-align:center; }
  .sw { width:14px; height:14px; border-radius:50%; display:inline-block; vertical-align:-2px; }
  #sync { font-size:12px; color:var(--mut); min-width:110px; }
  #sync.err { color:var(--bad); } #sync.ok { color:var(--ok); }
  a { color:var(--acc); text-decoration:none; }
  #pages { position:absolute; top:var(--barh,46px); bottom:var(--qh,0px); left:0; right:0; overflow:auto; }
  .page { position:relative; margin:10px auto; background:#fff; box-shadow:0 2px 8px #0006; }
  .page canvas { position:absolute; inset:0; width:100%; height:100%; }
  .page .num { position:absolute; left:-46px; top:4px; color:#aab; font-size:12px; }
  .ink { pointer-events:none; }
  #pages.draw .ink { pointer-events:auto; touch-action:none; cursor:crosshair; }
  #pages.erase .ink { pointer-events:auto; touch-action:none; cursor:cell; }
  #qbar { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--line);
          padding:5px 10px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; font-size:13px; z-index:10; }
  #qbar:empty { display:none; }
  .q { display:flex; gap:4px; align-items:center; }
  .q .st button { padding:1px 6px; font-size:12px; opacity:.45; }
  .q .st button.sel { opacity:1; color:#111; font-weight:600; }
  .st .Solved.sel { background:var(--ok); } .st .Wrong.sel { background:var(--bad); }
  .st .Shaky.sel { background:var(--shaky); } .st .Unsolved.sel { background:var(--un); color:#fff; }
  .mut { color:var(--mut); }
  #msg { position:absolute; top:40%; width:100%; text-align:center; color:#ddd; }
</style>
</head>
<body>
<div id="bar">
  <div class="grp"><a href="/">← Tracker</a>&nbsp;<b id="volname"></b></div>
  <div class="grp">
    <button id="prevp" title="Previous page">‹</button>
    <input id="pg" /> <span class="mut" id="pgtot"></span>
    <button id="nextp" title="Next page">›</button>
  </div>
  <div class="grp">
    <button id="zout" title="Zoom out">−</button><span id="zl" class="mut">100%</span><button id="zin" title="Zoom in">+</button>
  </div>
  <div class="grp" id="tools">
    <button data-tool="hand" class="on" title="Scroll / read (V)">✋</button>
    <button data-tool="pen" data-color="#1f5fff" title="Blue pen (P)"><span class="sw" style="background:#1f5fff"></span></button>
    <button data-tool="pen" data-color="#e0245e" title="Red pen"><span class="sw" style="background:#e0245e"></span></button>
    <button data-tool="pen" data-color="#14a44d" title="Green pen"><span class="sw" style="background:#14a44d"></span></button>
    <button data-tool="hl" data-color="#ffe14d" title="Highlighter (H)">🖍</button>
    <button data-tool="erase" title="Eraser (E)">⌫</button>
  </div>
  <div class="grp">
    <button id="undo" title="Undo (Ctrl+Z)" disabled>↶</button>
    <button id="redo" title="Redo (Ctrl+Y)" disabled>↷</button>
  </div>
  <span id="sync" class="ok">Saved</span>
  <button id="dl" title="Download PDF with your marks baked in">⬇ Annotated PDF</button>
</div>
<div id="pages"><div id="msg">Loading PDF…</div></div>
<div id="qbar"></div>

<script type="module">
import * as pdfjsLib from "/vendor/pdfjs/pdf.min.mjs";
pdfjsLib.GlobalWorkerOptions.workerSrc = "/vendor/pdfjs/pdf.worker.min.mjs";

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const VOL = ["vol1", "vol2"].includes(params.get("vol")) ? params.get("vol") : "vol1";
const VOLNAME = VOL === "vol1" ? "Vol 1" : "Vol 2";
const DPR = Math.min(window.devicePixelRatio || 1, 2);
const PEN_W = 0.0022, HL_W = 0.014;   // stroke widths as fraction of page width
const STAT = ["Unsolved", "Solved", "Wrong", "Shaky"];
$("#volname").textContent = VOLNAME;
document.title = `${VOLNAME} · GATE PYQ`;

const pagesEl = $("#pages");
const fixLayout = () => {
  document.documentElement.style.setProperty("--barh", $("#bar").offsetHeight + "px");
  document.documentElement.style.setProperty("--qh", $("#qbar").offsetHeight + "px");
};
new ResizeObserver(fixLayout).observe($("#bar"));
new ResizeObserver(fixLayout).observe($("#qbar"));

// ---------- state ----------
let doc, N, baseW, baseH, fitScale = 1, zoom = 1, cur = 1;
const sizes = {};            // page -> [w,h] at scale 1
const pageEls = [];          // index page-1 -> {el, pdf, ink, task, rendered}
let ann = {};                // page -> strokes[]
let tool = "hand", color = "#1f5fff";
const undoStack = [], redoStack = [];
const PKEY = `gate-pending-${VOL}`;
let pending = JSON.parse(localStorage.getItem(PKEY) || "{}");
let questions = [];

// ---------- load ----------
async function main() {
  const [annRes] = await Promise.all([fetch(`/api/annotations/${VOL}`)]);
  if (annRes.status === 401) { location.href = "/"; return; }
  ann = await annRes.json();
  Object.assign(ann, pending);                  // unsynced local edits win
  fetch("/api/questions").then((r) => r.json()).then((q) => { questions = q.filter((x) => x.volume === VOLNAME); renderQ(); }).catch(() => {});

  try {
    doc = await pdfjsLib.getDocument({ url: `/pdf/${VOL}`, withCredentials: true }).promise;
  } catch (e) {
    $("#msg").textContent = "Could not load PDF: " + (e.message || e) + " (has it been uploaded?)";
    return;
  }
  N = doc.numPages;
  $("#pgtot").textContent = "/ " + N;
  const p1 = await doc.getPage(1);
  const v = p1.getViewport({ scale: 1 });
  baseW = v.width; baseH = v.height; sizes[1] = [baseW, baseH];
  $("#msg").remove();
  computeFit();
  for (let i = 1; i <= N; i++) {
    const el = document.createElement("div");
    el.className = "page"; el.dataset.page = i;
    el.innerHTML = `<span class="num">${i}</span>`;
    const pdf = document.createElement("canvas"), ink = document.createElement("canvas");
    pdf.className = "pdf"; ink.className = "ink";
    el.append(pdf, ink);
    pagesEl.append(el);
    pageEls[i - 1] = { el, pdf, ink, task: null, rendered: false };
    bindInk(i, ink);
  }
  layout();
  goTo(Math.min(Math.max(1, Number(params.get("page")) || 1), N), false);
  flush();
}

function computeFit() {
  const avail = pagesEl.clientWidth - 60;
  fitScale = Math.max(0.3, Math.min(avail / baseW, 1.6));
}
const scale = () => fitScale * zoom;
function pageCss(i) {
  const [w, h] = sizes[i] || [baseW, baseH];
  return [Math.round(w * scale()), Math.round(h * scale())];
}
function layout() {
  for (let i = 1; i <= N; i++) {
    const [w, h] = pageCss(i), p = pageEls[i - 1];
    p.el.style.width = w + "px"; p.el.style.height = h + "px";
    unrender(i);
  }
  $("#zl").textContent = Math.round(zoom * 100) + "%";
  observeAll();
}

// ---------- lazy rendering ----------
let io;
function observeAll() {
  io?.disconnect();
  io = new IntersectionObserver((ents) => {
    for (const e of ents) {
      const i = Number(e.target.dataset.page);
      if (e.isIntersecting) renderPage(i); else unrender(i);
    }
  }, { root: pagesEl, rootMargin: "1200px 0px" });
  pageEls.forEach((p) => io.observe(p.el));
}
async function renderPage(i) {
  const p = pageEls[i - 1];
  if (p.rendered) return;
  p.rendered = true;
  const page = await doc.getPage(i);
  const v1 = page.getViewport({ scale: 1 });
  if (!sizes[i] || sizes[i][0] !== v1.width || sizes[i][1] !== v1.height) {
    sizes[i] = [v1.width, v1.height];
    const [w, h] = pageCss(i);
    p.el.style.width = w + "px"; p.el.style.height = h + "px";
  }
  if (!p.rendered) return;
  const [w, h] = pageCss(i);
  const vp = page.getViewport({ scale: scale() * DPR });
  p.pdf.width = vp.width; p.pdf.height = vp.height;
  p.ink.width = Math.round(w * DPR); p.ink.height = Math.round(h * DPR);
  drawInk(i);
  p.task = page.render({ canvasContext: p.pdf.getContext("2d"), viewport: vp });
  try { await p.task.promise; } catch (_) { /* cancelled */ }
  p.task = null;
}
function unrender(i) {
  const p = pageEls[i - 1];
  if (!p.rendered) return;
  p.task?.cancel(); p.task = null;
  p.pdf.width = p.pdf.height = 0; p.ink.width = p.ink.height = 0;
  p.rendered = false;
}

// ---------- ink ----------
function drawStroke(ctx, s, W, H) {
  ctx.save();
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.strokeStyle = s.c;
  ctx.lineWidth = s.w * W;
  if (s.t === "hl") { ctx.globalAlpha = 0.35; ctx.globalCompositeOperation = "multiply"; ctx.lineCap = "butt"; }
  ctx.beginPath();
  const p = s.p;
  ctx.moveTo(p[0] * W, p[1] * H);
  if (p.length === 2) ctx.lineTo(p[0] * W + 0.01, p[1] * H);
  for (let k = 2; k < p.length; k += 2) ctx.lineTo(p[k] * W, p[k + 1] * H);
  ctx.stroke();
  ctx.restore();
}
function drawInk(i, extra) {
  const p = pageEls[i - 1];
  if (!p.rendered) return;
  const ctx = p.ink.getContext("2d"), W = p.ink.width, H = p.ink.height;
  ctx.clearRect(0, 0, W, H);
  for (const s of ann[i] || []) drawStroke(ctx, s, W, H);
  if (extra) drawStroke(ctx, extra, W, H);
}
const r4 = (x) => Math.round(x * 10000) / 10000;

function bindInk(i, ink) {
  let stroke = null, before = null, erased = false;
  const norm = (e) => { const r = ink.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height, r]; };
  const eraseAt = (e) => {
    const [x, y, r] = norm(e);
    const tol = 10;
    const list = ann[i] || [];
    const keep = list.filter((s) => {
      for (let k = 0; k < s.p.length; k += 2)
        if (Math.hypot((s.p[k] - x) * r.width, (s.p[k + 1] - y) * r.height) < tol + (s.w * r.width) / 2) return false;
      return true;
    });
    if (keep.length !== list.length) { ann[i] = keep; erased = true; drawInk(i); }
  };
  ink.addEventListener("pointerdown", (e) => {
    if (tool === "hand" || e.button > 0) return;
    e.preventDefault();
    ink.setPointerCapture(e.pointerId);
    before = ann[i] || [];
    if (tool === "erase") { erased = false; eraseAt(e); return; }
    const [x, y] = norm(e);
    stroke = { t: tool, c: color, w: tool === "hl" ? HL_W : PEN_W, p: [r4(x), r4(y)] };
    drawInk(i, stroke);
  });
  ink.addEventListener("pointermove", (e) => {
    if (!ink.hasPointerCapture(e.pointerId)) return;
    if (tool === "erase") return eraseAt(e);
    if (!stroke) return;
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    const r = ink.getBoundingClientRect();
    for (const ev of evs) {
      const x = (ev.clientX - r.left) / r.width, y = (ev.clientY - r.top) / r.height;
      const n = stroke.p.length;
      if (Math.hypot((x - stroke.p[n - 2]) * r.width, (y - stroke.p[n - 1]) * r.height) < 1.5) continue;
      stroke.p.push(r4(x), r4(y));
    }
    drawInk(i, stroke);
  });
  const end = (e) => {
    if (!ink.hasPointerCapture(e.pointerId)) return;
    ink.releasePointerCapture(e.pointerId);
    if (tool === "erase") { if (erased) commit(i, before, ann[i]); return; }
    if (!stroke) return;
    const after = [...before, stroke];
    stroke = null;
    ann[i] = after;
    commit(i, before, after);
  };
  ink.addEventListener("pointerup", end);
  ink.addEventListener("pointercancel", end);
}

function commit(i, before, after) {
  undoStack.push({ i, before, after }); redoStack.length = 0;
  if (undoStack.length > 200) undoStack.shift();
  setPage(i, after, false);
}
function setPage(i, strokes, push = true) {
  ann[i] = strokes; drawInk(i); markDirty(i); updUndo();
}
function undo() { const a = undoStack.pop(); if (!a) return; redoStack.push(a); setPage(a.i, a.before); goToIfFar(a.i); }
function redo() { const a = redoStack.pop(); if (!a) return; undoStack.push(a); setPage(a.i, a.after); goToIfFar(a.i); }
function updUndo() { $("#undo").disabled = !undoStack.length; $("#redo").disabled = !redoStack.length; }
function goToIfFar(i) { if (Math.abs(i - cur) > 1) goTo(i); }

// ---------- sync ----------
let flushTimer = null, flushing = false;
function markDirty(i) {
  pending[i] = ann[i];
  localStorage.setItem(PKEY, JSON.stringify(pending));
  setSync("Saving…");
  clearTimeout(flushTimer); flushTimer = setTimeout(flush, 700);
}
function setSync(t, cls = "") { const s = $("#sync"); s.textContent = t; s.className = cls; }
async function flush() {
  if (flushing) return;
  const pages = Object.keys(pending);
  if (!pages.length) { setSync("Saved ✓", "ok"); return; }
  if (!navigator.onLine) { setSync(`Offline · ${pages.length} page(s) unsaved`, "err"); return; }
  flushing = true; setSync("Saving…");
  try {
    for (const pg of pages) {
      const strokes = pending[pg];
      const r = await fetch(`/api/annotations/${VOL}/${pg}`, {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ strokes }) });
      if (r.status === 401) { setSync("Logged out — open Tracker to log in", "err"); flushing = false; return; }
      if (!r.ok) throw new Error(r.status);
      if (pending[pg] === strokes) delete pending[pg];
    }
    localStorage.setItem(PKEY, JSON.stringify(pending));
    flushing = false;
    if (Object.keys(pending).length) return flush();
    setSync("Saved ✓", "ok");
  } catch (e) {
    flushing = false;
    setSync(`Not saved · retrying`, "err");
    clearTimeout(flushTimer); flushTimer = setTimeout(flush, 5000);
  }
}
addEventListener("online", flush);
addEventListener("offline", () => flush());
addEventListener("beforeunload", (e) => { if (Object.keys(pending).length) { flush(); e.preventDefault(); e.returnValue = ""; } });
// pick up marks made on the other laptop when coming back to this tab
document.addEventListener("visibilitychange", async () => {
  if (document.hidden || Object.keys(pending).length || !doc) return;
  try {
    const r = await fetch(`/api/annotations/${VOL}`);
    if (!r.ok) return;
    ann = await r.json();
    undoStack.length = redoStack.length = 0; updUndo();
    for (let i = 1; i <= N; i++) drawInk(i);
  } catch (_) {}
});

// ---------- navigation ----------
function goTo(i, smooth = false) {
  i = Math.min(Math.max(1, i), N);
  pageEls[i - 1].el.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
  setCur(i);
}
function setCur(i) {
  if (i === cur && $("#pg").value) return;
  cur = i; $("#pg").value = i;
  history.replaceState(null, "", `?vol=${VOL}&page=${i}`);
  renderQ();
}
pagesEl.addEventListener("scroll", () => {
  if (!N) return;
  const mid = pagesEl.scrollTop + pagesEl.clientHeight * 0.3;
  let lo = 0, hi = N - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (pageEls[m].el.offsetTop <= mid) lo = m; else hi = m - 1; }
  setCur(lo + 1);
}, { passive: true });
$("#pg").addEventListener("change", () => goTo(Number($("#pg").value) || 1));
$("#prevp").onclick = () => goTo(cur - 1);
$("#nextp").onclick = () => goTo(cur + 1);
function setZoom(z) {
  const keep = cur;
  zoom = Math.min(Math.max(z, 0.5), 3);
  layout(); goTo(keep);
}
$("#zin").onclick = () => setZoom(zoom + 0.15);
$("#zout").onclick = () => setZoom(zoom - 0.15);
let rzT; addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (!N) return; const k = cur; computeFit(); layout(); goTo(k); }, 250); });

// ---------- tools ----------
function setTool(btn) {
  document.querySelectorAll("#tools button").forEach((b) => b.classList.toggle("on", b === btn));
  tool = btn.dataset.tool; if (btn.dataset.color) color = btn.dataset.color;
  pagesEl.classList.toggle("draw", tool === "pen" || tool === "hl");
  pagesEl.classList.toggle("erase", tool === "erase");
}
document.querySelectorAll("#tools button").forEach((b) => (b.onclick = () => setTool(b)));
$("#undo").onclick = undo; $("#redo").onclick = redo;
addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT") return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "y") { e.preventDefault(); redo(); }
  else if (!e.ctrlKey && !e.metaKey) {
    const k = { v: 'hand', p: 'pen', h: 'hl', e: 'erase' }[e.key.toLowerCase()];
    if (k) setTool(document.querySelector(`#tools [data-tool="${k}"]`));
  }
});

// ---------- questions on current page ----------
function renderQ() {
  const here = questions.filter((q) => q.pdf_page === cur);
  $("#qbar").innerHTML = here.length ? `<span class="mut">On this page:</span>` + here.map((q) => `
    <span class="q" data-id="${q.id}"><b>${q.qid}</b>
      <span class="st">${STAT.map((s) => `<button class="${s} ${q.status === s ? "sel" : ""}" data-st="${s}" title="${s}">${s[0]}</button>`).join("")}</span>
    </span>`).join("") : "";
}
$("#qbar").onclick = async (e) => {
  const st = e.target.dataset.st; if (!st) return;
  const id = Number(e.target.closest(".q").dataset.id);
  const r = await fetch(`/api/questions/${id}`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ status: st }) });
  if (r.ok) { Object.assign(questions.find((q) => q.id === id), await r.json()); renderQ(); }
};

// ---------- download annotated PDF ----------
$("#dl").onclick = async () => {
  const btn = $("#dl"); btn.disabled = true; btn.textContent = "Preparing…";
  try {
    if (!window.PDFLib) await new Promise((ok, bad) => { const s = document.createElement("script"); s.src = "/vendor/pdf-lib/pdf-lib.min.js"; s.onload = ok; s.onerror = bad; document.head.append(s); });
    const { PDFDocument, rgb, LineCapStyle } = window.PDFLib;
    const bytes = await (await fetch(`/pdf/${VOL}`)).arrayBuffer();
    const pdf = await PDFDocument.load(bytes, { ignoreEncryption: true });
    const hex = (h) => rgb(parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255);
    for (const [pg, strokes] of Object.entries(ann)) {
      const page = pdf.getPage(Number(pg) - 1); if (!page || !strokes.length) continue;
      const box = page.getCropBox();
      for (const s of strokes) {
        const p = s.p;
        let d = `M ${p[0] * box.width} ${p[1] * box.height}`;
        if (p.length === 2) d += ` L ${p[0] * box.width + 0.1} ${p[1] * box.height}`;
        for (let k = 2; k < p.length; k += 2) d += ` L ${p[k] * box.width} ${p[k + 1] * box.height}`;
        page.drawSvgPath(d, { x: box.x, y: box.y + box.height, borderColor: hex(s.c), borderWidth: s.w * box.width,
          borderOpacity: s.t === "hl" ? 0.35 : 1, borderLineCap: s.t === "hl" ? LineCapStyle.Butt : LineCapStyle.Round });
      }
    }
    const out = await pdf.save();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([out], { type: "application/pdf" }));
    a.download = `volume${VOL.slice(3)}_annotated.pdf`; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);
  } catch (e) { alert("Export failed: " + e.message); }
  btn.disabled = false; btn.textContent = "⬇ Annotated PDF";
};

main();
</script>
</body>
</html>
