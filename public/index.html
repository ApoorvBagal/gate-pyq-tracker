<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GATE PYQ Tracker</title>
<style>
  :root { --bg:#0f1220; --card:#181c2e; --line:#2a2f48; --fg:#e6e8f2; --mut:#8b90a8; --acc:#6c8cff;
          --ok:#3ecf8e; --bad:#ff6b6b; --shaky:#f5b041; --un:#5b6078; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--fg); }
  header { display:flex; gap:12px; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:17px; margin:0; flex:1; }
  button, select, input, textarea { font:inherit; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:6px 10px; }
  button { cursor:pointer; } button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
  main { padding:16px 18px; max-width:1300px; margin:auto; }
  .hidden { display:none !important; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .card b { font-size:22px; display:block; } .card span { color:var(--mut); font-size:12px; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:7px 8px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  th { color:var(--mut); font-weight:500; font-size:12px; position:sticky; top:57px; background:var(--bg); }
  tr.sub:hover { background:#1d2238; cursor:pointer; }
  .bar { height:8px; background:var(--un); border-radius:4px; overflow:hidden; display:flex; min-width:120px; }
  .bar i { display:block; height:100%; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  .filters input[type=search] { flex:1; min-width:180px; }
  .st { display:flex; gap:3px; }
  .st button { padding:3px 7px; font-size:12px; opacity:.45; }
  .st button.sel { opacity:1; color:#111; font-weight:600; }
  .st .Solved.sel { background:var(--ok); } .st .Wrong.sel { background:var(--bad); }
  .st .Shaky.sel { background:var(--shaky); } .st .Unsolved.sel { background:var(--un); color:#fff; }
  .star { background:none; border:none; font-size:18px; color:var(--mut); padding:0 4px; }
  .star.on { color:#ffd84d; }
  textarea.note { width:100%; min-width:160px; height:30px; resize:vertical; font-size:12px; padding:4px 6px; }
  .mut { color:var(--mut); font-size:12px; }
  .pill { font-size:11px; padding:1px 6px; border-radius:8px; background:#252a42; color:var(--mut); }
  #login { max-width:320px; margin:15vh auto; display:flex; flex-direction:column; gap:10px; }
  #toast { position:fixed; bottom:16px; right:16px; background:var(--card); border:1px solid var(--line); padding:8px 12px; border-radius:6px; opacity:0; transition:.2s; }
  #toast.show { opacity:1; }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin:14px 0; }
  @media (max-width:800px){ .hide-sm { display:none; } th { top:0; position:static; } }
</style>
</head>
<body>
<form id="login" class="hidden">
  <h2>GATE PYQ Tracker</h2>
  <input type="password" id="pw" placeholder="Password" autofocus />
  <button class="on">Log in</button>
  <div id="loginErr" class="mut"></div>
</form>

<div id="app" class="hidden">
  <header>
    <h1>GATE CSE PYQ Tracker</h1>
    <button data-view="dash" class="on">Dashboard</button>
    <button data-view="list">Questions</button>
    <a href="/api/export.csv"><button>Export CSV</button></a>
    <button id="logout">Log out</button>
  </header>
  <main>
    <section id="dash">
      <div class="cards" id="cards"></div>
      <table>
        <thead><tr><th>Subject</th><th>Total</th><th>Solved</th><th>Wrong</th><th>Shaky</th><th>Unsolved</th><th>% Solved</th><th class="hide-sm">Progress</th><th>★ pending</th></tr></thead>
        <tbody id="subj"></tbody>
      </table>
      <p class="mut">Click a subject to open its questions. Status: a guessed or hesitant answer is <b>Shaky</b>, not Solved.</p>
    </section>

    <section id="list" class="hidden">
      <div class="filters">
        <input type="search" id="q" placeholder="Search ID, topic, exam, notes…" />
        <select id="fSubject"><option value="">All subjects</option></select>
        <select id="fTopic"><option value="">All topics</option></select>
        <select id="fVol"><option value="">Both volumes</option><option>Vol 1</option><option>Vol 2</option></select>
        <select id="fStatus"><option value="">Any status</option><option>Unsolved</option><option>Solved</option><option>Wrong</option><option>Shaky</option><option value="needs">Wrong + Shaky</option></select>
        <select id="fDiff"><option value="">Any difficulty</option><option>Easy</option><option>Normal</option><option>Difficult</option><option value="none">Untagged</option></select>
        <label class="mut"><input type="checkbox" id="fImp" /> ★ only</label>
        <button id="clear">Clear</button>
      </div>
      <div class="mut" id="count"></div>
      <table>
        <thead><tr><th>ID</th><th>Vol</th><th class="hide-sm">Topic</th><th>Exam</th><th>Page</th><th class="hide-sm">Diff</th><th>Status</th><th>★</th><th class="hide-sm">Last</th><th>Notes</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="pager"><button id="prev">‹ Prev</button><span id="pg" class="mut"></span><button id="next">Next ›</button></div>
    </section>
  </main>
</div>
<div id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const STAT = ["Unsolved","Solved","Wrong","Shaky"];
const PAGE = 100;
let Q = [], page = 0;

const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1500); };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

async function api(url, opts = {}) {
  const r = await fetch(url, { headers: { "Content-Type": "application/json" }, ...opts });
  if (r.status === 401) { showLogin(); throw new Error("auth"); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}
function showLogin() { $("#app").classList.add("hidden"); $("#login").classList.remove("hidden"); $("#pw").focus(); }

$("#login").onsubmit = async (e) => {
  e.preventDefault();
  const r = await fetch("/api/login", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ password: $("#pw").value }) });
  if (!r.ok) { $("#loginErr").textContent = "Wrong password"; return; }
  $("#login").classList.add("hidden"); load();
};
$("#logout").onclick = async () => { await fetch("/api/logout", { method:"POST" }); showLogin(); };

async function load() {
  Q = await api("/api/questions");
  $("#app").classList.remove("hidden");
  const subs = [...new Set(Q.map((q) => q.subject))];
  $("#fSubject").innerHTML = '<option value="">All subjects</option>' + subs.map((s) => `<option>${esc(s)}</option>`).join("");
  fillTopics(); renderDash(); renderList();
}
function fillTopics() {
  const s = $("#fSubject").value;
  const t = [...new Set(Q.filter((q) => !s || q.subject === s).map((q) => q.topic))].sort();
  const cur = $("#fTopic").value;
  $("#fTopic").innerHTML = '<option value="">All topics</option>' + t.map((x) => `<option ${x===cur?"selected":""}>${esc(x)}</option>`).join("");
}

function counts(list) {
  const c = { total: list.length, Solved:0, Wrong:0, Shaky:0, Unsolved:0, imp:0 };
  list.forEach((q) => { c[q.status]++; if (q.important && q.status !== "Solved") c.imp++; });
  return c;
}
function bar(c) {
  const w = (n) => (c.total ? (n / c.total) * 100 : 0);
  return `<div class="bar"><i style="width:${w(c.Solved)}%;background:var(--ok)"></i><i style="width:${w(c.Shaky)}%;background:var(--shaky)"></i><i style="width:${w(c.Wrong)}%;background:var(--bad)"></i></div>`;
}
function renderDash() {
  const c = counts(Q);
  const today = new Date().toISOString().slice(0,10);
  const doneToday = Q.filter((q) => q.last_attempted === today).length;
  const pct = c.total ? ((c.Solved / c.total) * 100).toFixed(1) : 0;
  $("#cards").innerHTML = [
    ["Total", c.total], ["Solved", c.Solved], ["Wrong", c.Wrong], ["Shaky", c.Shaky],
    ["Unsolved", c.Unsolved], ["% Solved", pct + "%"], ["★ pending", c.imp], ["Attempted today", doneToday],
  ].map(([k, v]) => `<div class="card"><b>${v}</b><span>${k}</span></div>`).join("");
  const subs = {};
  Q.forEach((q) => (subs[q.subject] ||= []).push(q));
  $("#subj").innerHTML = Object.entries(subs).map(([s, l]) => {
    const k = counts(l);
    return `<tr class="sub" data-s="${esc(s)}"><td>${esc(s)}</td><td>${k.total}</td><td>${k.Solved}</td><td>${k.Wrong}</td><td>${k.Shaky}</td><td>${k.Unsolved}</td><td>${((k.Solved/k.total)*100).toFixed(0)}%</td><td class="hide-sm">${bar(k)}</td><td>${k.imp}</td></tr>`;
  }).join("");
}
$("#subj").onclick = (e) => {
  const tr = e.target.closest("tr"); if (!tr) return;
  $("#fSubject").value = tr.dataset.s; fillTopics(); $("#fTopic").value = ""; page = 0; switchView("list");
};

function filtered() {
  const q = $("#q").value.trim().toLowerCase(), s = $("#fSubject").value, t = $("#fTopic").value,
        v = $("#fVol").value, st = $("#fStatus").value, d = $("#fDiff").value, imp = $("#fImp").checked;
  return Q.filter((x) =>
    (!s || x.subject === s) && (!t || x.topic === t) && (!v || x.volume === v) &&
    (!st || (st === "needs" ? (x.status === "Wrong" || x.status === "Shaky") : x.status === st)) &&
    (!d || (d === "none" ? !x.difficulty : x.difficulty === d)) && (!imp || x.important) &&
    (!q || `${x.qid} ${x.topic} ${x.exam} ${x.notes} ${x.subject}`.toLowerCase().includes(q)));
}
function renderList() {
  const f = filtered();
  const pages = Math.max(1, Math.ceil(f.length / PAGE));
  page = Math.min(page, pages - 1);
  $("#count").textContent = `${f.length} questions`;
  $("#pg").textContent = `Page ${page + 1} / ${pages}`;
  $("#rows").innerHTML = f.slice(page * PAGE, page * PAGE + PAGE).map((x) => `
    <tr data-id="${x.id}">
      <td><b>${esc(x.qid)}</b></td><td>${esc(x.volume.replace("Vol ","V"))}</td>
      <td class="hide-sm">${esc(x.topic)}</td><td class="mut">${esc(x.exam)}</td><td>${x.pdf_page ?? ""}</td>
      <td class="hide-sm">${x.difficulty ? `<span class="pill">${esc(x.difficulty)}</span>` : ""}</td>
      <td><div class="st">${STAT.map((s) => `<button class="${s} ${x.status===s?"sel":""}" data-st="${s}" title="${s}">${s[0]}</button>`).join("")}</div></td>
      <td><button class="star ${x.important?"on":""}">★</button></td>
      <td class="hide-sm mut">${x.last_attempted ?? ""}</td>
      <td><textarea class="note" placeholder="…">${esc(x.notes)}</textarea></td>
    </tr>`).join("");
}

async function update(id, body) {
  const q = Q.find((x) => x.id === id);
  try {
    const r = await api(`/api/questions/${id}`, { method:"PATCH", body: JSON.stringify(body) });
    Object.assign(q, r); toast("Saved"); renderDash(); renderList();
  } catch (e) { if (e.message !== "auth") toast("Save failed: " + e.message); }
}
$("#rows").onclick = (e) => {
  const tr = e.target.closest("tr"); if (!tr) return;
  const id = Number(tr.dataset.id);
  if (e.target.dataset.st) update(id, { status: e.target.dataset.st });
  else if (e.target.classList.contains("star")) update(id, { important: !Q.find((x) => x.id === id).important });
};
$("#rows").addEventListener("change", (e) => {
  if (!e.target.classList.contains("note")) return;
  update(Number(e.target.closest("tr").dataset.id), { notes: e.target.value });
});

["#q","#fTopic","#fVol","#fStatus","#fDiff","#fImp"].forEach((s) => $(s).addEventListener("input", () => { page = 0; renderList(); }));
$("#fSubject").addEventListener("input", () => { fillTopics(); $("#fTopic").value = ""; page = 0; renderList(); });
$("#clear").onclick = () => { ["#q","#fSubject","#fVol","#fStatus","#fDiff"].forEach((s) => ($(s).value = "")); $("#fImp").checked = false; fillTopics(); page = 0; renderList(); };
$("#prev").onclick = () => { if (page > 0) { page--; renderList(); scrollTo(0,0); } };
$("#next").onclick = () => { page++; renderList(); scrollTo(0,0); };

function switchView(v) {
  document.querySelectorAll("[data-view]").forEach((b) => b.classList.toggle("on", b.dataset.view === v));
  $("#dash").classList.toggle("hidden", v !== "dash"); $("#list").classList.toggle("hidden", v !== "list");
  if (v === "list") renderList();
}
document.querySelectorAll("[data-view]").forEach((b) => (b.onclick = () => switchView(b.dataset.view)));
// refresh when coming back to the tab (picks up changes made on the other laptop)
document.addEventListener("visibilitychange", () => { if (!document.hidden && Q.length) load().catch(() => {}); });

load().catch(() => {});
</script>
</body>
</html>
